name: Daily Stick Cat Shorts

on:
  schedule:
    - cron: '0 14 * * 1-5'  # Mon-Fri at 2 PM UTC (7:30 PM IST)
  workflow_dispatch:

jobs:
  generate-short:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
          fc-cache -f

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decode YouTube credentials
        env:
          YT_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          YT_CLIENT_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_BASE64 }}
        # Resolves base64 (or a raw value), validates that the result is real
        # OAuth material, and fails with an exact ::error:: annotation. Falls
        # back to the committed/public credential file when a secret is
        # missing - the old 'base64 -d | echo' path silently wrote EMPTY files
        # here, which then crashed as "Token file corrupted (Ran out of input)".
        run: python automation/prepare_credentials.py

      - name: Generate shorts
        working-directory: automation
        run: python generate_short.py
        env:
          PYTHONUNBUFFERED: 1

      - name: Upload video artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stick-cat-short-${{ github.run_number }}
          path: |
            automation/output/short_*/short_*.mp4
          retention-days: 7

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automation/processed_episodes.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Auto: update Stick Cat Shorts state (run ${{ github.run_number }})"
          git push
